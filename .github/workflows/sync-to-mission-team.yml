name: Sync Mission Templates to Mission Team

on:
  push:
    branches:
      - main
    paths:
      - '506IRRUMissionTemplates/**'
      - '.github/workflows/sync-to-mission-team.yml'
  workflow_dispatch:

concurrency:
  group: sync-to-mission-team
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-to-mission-team:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip sync]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mod-team repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "506IRRU sync bot"
          git config --global user.email "actions@github.com"

      - name: Clone mission-team repo
        env:
          GH_PAT: ${{ secrets.PAT }}
        run: |
          git clone "https://x-access-token:${GH_PAT}@github.com/506IRRUS-4LogisticsTeam/mission-team.git" mission-team

      - name: Sync 506IRRUMissionTemplates into mission-team folder
        run: |
          if [ ! -d "./506IRRUMissionTemplates" ]; then
            echo "Source folder ./506IRRUMissionTemplates not found."
            exit 1
          fi

          mkdir -p mission-team/506IRRUMissionTemplates
          rsync -av --delete \
            506IRRUMissionTemplates/ mission-team/506IRRUMissionTemplates/

      - name: Commit and push changes
        run: |
          cd mission-team

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
            exit 0
          fi

          git add -A
          git commit -m "Sync from 506IRRUMissionTemplates [skip sync]"
          git push origin main
