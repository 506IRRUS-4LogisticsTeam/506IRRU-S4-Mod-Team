name: Sync Mission Templates to Mission Team

on:
  push:
    paths:
      - '506IRRUMissionTemplates/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"

      - name: Create subtree split
        run: |
          git subtree split --prefix="506IRRUMissionTemplates" -b split-branch

      - name: Clone mission-team repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/506IRRUS-4LogisticsTeam/mission-team.git teamrepo

      - name: Rebuild correct folder structure
        run: |
          cd teamrepo

          # Clear repo safely
          find . -mindepth 1 ! -name '.git' -exec rm -rf {} +

          # Create required folder
          mkdir 506IRRUMissionTemplates

          # Pull split content into temp
          cd ..
          mkdir temp
          git --git-dir=.git checkout split-branch -- .
          mv * temp/ 2>/dev/null || true

          # Move into correct folder
          mv temp/* teamrepo/506IRRUMissionTemplates/ 2>/dev/null || true

      - name: Commit and push
        run: |
          cd teamrepo
          git add .
          git commit -m "Sync from main (wrapped folder)" || echo "No changes"
          git push
