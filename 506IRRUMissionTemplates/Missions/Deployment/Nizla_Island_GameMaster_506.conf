 m_sName "Operation Frostline - Nizla Island"
 m_sAuthor "JamesD, Edited by 506IRRU S-4"
 m_sDescription "More of the island is secure and we have a very solid foot hold. OPFOR have put up one strong fight and it is clear initial reports about Northern Vanguard Forces not being present were wrong. At this time we will focusing on Civilian aid and still routing OPFOR from the AO. After all the fighting during the uprising we have reports that local towns are in desperate need."\
 ""\
 "Nizla Island is different from Merak Island in a few ways. Firstly, it has major elevation differences with a mountain ridge splitting the island. Secondly, the island has a lot more Forests, and civilian centers are closer together than previously seen. Lastly, there are a few Military Instillations already built on the island. They once were used to train the Military, and locals on defending the island. As time went on their use fell away as no one expected any attacks to come."\
