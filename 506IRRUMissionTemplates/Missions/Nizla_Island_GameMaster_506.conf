 m_sName "Operation Frost Line - Nizla Island"
 m_sAuthor "JamesD"
 m_sDescription "Nizla is a little-known yet stunning island that is part of the Jamdy archipelago, long disputed between the Soviet Union and the United States due to its strategic position. Once a medieval commercial crossroads, it is now home to a wealth of castle ruins, remnants, and buried military secrets. Despite its tense past, Nizla has become a discreet tourist destination, favored for its wild landscapes, secluded beaches, and unique heritage. Its economy mainly relies on the export of wood and its derivatives, traditional agriculture, and mining. Even today, Nizla remains a significant military strategic point on a global scale, further enhancing its geopolitical importance at the heart of modern maritime routes. Between history, mystery, power, and natural beauty, Nizla remains an overlooked gem waiting to be discovered."
